<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- 3D Radial Gradient for Left Head -->
    <radialGradient id="head-left" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#bceaff" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </radialGradient>
    
    <!-- 3D Radial Gradient for Right Head -->
    <radialGradient id="head-right" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#bceaff" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </radialGradient>

    <!-- 3D Radial Gradient for Left Body -->
    <radialGradient id="body-left" cx="40%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#bceaff" />
      <stop offset="30%" stop-color="#0ea5e9" />
      <stop offset="80%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#075985" />
    </radialGradient>

    <!-- 3D Radial Gradient for Right Body -->
    <radialGradient id="body-right" cx="60%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#bceaff" />
      <stop offset="30%" stop-color="#0ea5e9" />
      <stop offset="80%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#075985" />
    </radialGradient>

    <!-- 3D Gradient for Green Connector -->
    <linearGradient id="green-link" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bef264" />
      <stop offset="30%" stop-color="#84cc16" />
      <stop offset="100%" stop-color="#4d7c0f" />
    </linearGradient>
    
    <!-- Inner shadow/glow filter for extra depth -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Left Figure -->
  <g filter="url(#glow)">
    <!-- Left Head -->
    <circle cx="34" cy="24" r="10" fill="url(#head-left)" />
    <!-- Left Body (crescent shape opening to the right) -->
    <path d="M 34 38 
             C 20 38, 14 54, 14 68 
             C 14 82, 28 85, 44 80 
             C 47 79, 47 75, 44 73 
             C 40 69, 39 63, 39 56 
             C 39 46, 36 42, 34 38 Z" 
          fill="url(#body-left)" />
  </g>

  <!-- Right Figure -->
  <g filter="url(#glow)">
    <!-- Right Head -->
    <circle cx="66" cy="24" r="10" fill="url(#head-right)" />
    <!-- Right Body (crescent shape opening to the left) -->
    <path d="M 66 38 
             C 80 38, 86 54, 86 68 
             C 86 82, 72 85, 56 80 
             C 53 79, 53 75, 56 73 
             C 60 69, 61 63, 61 56 
             C 61 46, 64 42, 66 38 Z" 
          fill="url(#body-right)" />
  </g>

  <!-- Green Connecting Link (3D capsule) -->
  <rect x="35" y="52" width="30" height="9" rx="4.5" fill="url(#green-link)" filter="url(#glow)" />
</svg>